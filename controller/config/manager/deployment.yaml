# Deployment for the workflow-notifier controller. Validate-only in this repo; never applied by CI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-notifier
  namespace: argo
  labels:
    app.kubernetes.io/name: workflow-notifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-notifier
    spec:
      serviceAccountName: workflow-notifier
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/henryekeocha/workflow-notifier:dev
          args:
            - --leader-elect
            - --namespace=$(WATCH_NAMESPACE)
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-notifier-webhook
                  key: url
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: workflow-notifier-webhook
                  key: secret
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
