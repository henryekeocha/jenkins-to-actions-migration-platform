# CI for this repository. Every job validates, lints, compiles or tests; none of them
# authenticates to a cloud provider or a cluster, and nothing is applied anywhere.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_VERSION: 1.7.12
  TEKTON_VERSION: v1.15.1
  CROSSPLANE_VERSION: v2.4.0
  UPJET_AWS_VERSION: v2.7.0

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install yamllint==1.38.0
      - run: yamllint --strict .

  actions:
    name: actionlint (repo + rendered skeleton)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/download-actionlint.bash" \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash "$RUNNER_TEMP/download-actionlint.bash" "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint this repository
        run: actionlint -color
      - name: Render the Backstage skeleton
        run: python hack/render-skeleton.py backstage/template/skeleton "$RUNNER_TEMP/skeleton"
      - name: actionlint the rendered skeleton workflow
        working-directory: ${{ runner.temp }}/skeleton
        run: |
          git init -q .
          actionlint -color
      - uses: azure/setup-helm@v5
        with:
          version: v3.15.2
      - name: helm lint the rendered skeleton chart
        run: |
          chart="$RUNNER_TEMP/skeleton/charts/example-svc"
          helm lint "$chart" -f "$chart/values-staging.yaml"
          helm template example-svc "$chart" -f "$chart/values-production.yaml" > /dev/null
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false
      - name: go vet the rendered skeleton service
        working-directory: ${{ runner.temp }}/skeleton
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/example-svc

  analyzer:
    name: migration-analyzer (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/migration-analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/migration-analyzer/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Run the analyzer on the legacy Jenkinsfile
        run: |
          migration-analyzer ../../legacy/jenkins/Jenkinsfile --format markdown -o "$RUNNER_TEMP/checklist.md"
          migration-analyzer ../../legacy/jenkins/Jenkinsfile --format json -o "$RUNNER_TEMP/checklist.json"
          cat "$RUNNER_TEMP/checklist.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: migration-checklist
          path: ${{ runner.temp }}/checklist.*

  controller:
    name: controller (go vet, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - run: go mod verify
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: controller
      - run: go test -race -count=1 -coverprofile=cover.out ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/controller
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive -diff infra/terraform
      - name: validate root
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: validate module
        working-directory: infra/terraform/modules/artifact-store
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  manifests:
    name: kubernetes manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - name: Install kubeconform and the crossplane CLI
        run: |
          kc="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSL "$kc/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" kubeconform
          curl -fsSL https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh | XP_VERSION="$CROSSPLANE_VERSION" sh
          mv crossplane "$RUNNER_TEMP/crossplane"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Tekton schemas (from the release CRDs) and validation
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tekton-release.yaml" \
            "https://github.com/tektoncd/pipeline/releases/download/${TEKTON_VERSION}/release.yaml"
          python hack/crd-schemas.py "$RUNNER_TEMP/schemas/tekton" "$RUNNER_TEMP/tekton-release.yaml"
          kubeconform -strict -summary \
            -schema-location "$RUNNER_TEMP/schemas/tekton/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json" \
            legacy/tekton/pipeline.yaml legacy/tekton/pipelinerun.yaml legacy/tekton/tasks/
      - name: Argo, Crossplane packages and controller manifests (CRDs catalog + core schemas)
        run: |
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$catalog/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            workflows/argo/ controller/config/ \
            infra/crossplane/xrd.yaml infra/crossplane/composition.yaml \
            infra/crossplane/functions.yaml infra/crossplane/providers.yaml
      - name: Example XR against the XRD schema
        run: |
          crossplane xrd convert infra/crossplane/xrd.yaml > "$RUNNER_TEMP/artifactstore-crd.yaml"
          python hack/crd-schemas.py "$RUNNER_TEMP/schemas/xrd" "$RUNNER_TEMP/artifactstore-crd.yaml"
          kubeconform -strict -summary \
            -schema-location "$RUNNER_TEMP/schemas/xrd/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json" \
            infra/crossplane/example-xr.yaml
      - name: Composed resources against the Upbound provider CRDs
        run: |
          U="https://raw.githubusercontent.com/crossplane-contrib/provider-upjet-aws/${UPJET_AWS_VERSION}/package/crds"
          python hack/crd-schemas.py "$RUNNER_TEMP/schemas/upbound" \
            "$U/s3.aws.m.upbound.io_buckets.yaml" \
            "$U/s3.aws.m.upbound.io_bucketversionings.yaml" \
            "$U/s3.aws.m.upbound.io_bucketserversideencryptionconfigurations.yaml" \
            "$U/s3.aws.m.upbound.io_bucketpublicaccessblocks.yaml" \
            "$U/iam.aws.m.upbound.io_roles.yaml" \
            "$U/iam.aws.m.upbound.io_policies.yaml" \
            "$U/iam.aws.m.upbound.io_rolepolicyattachments.yaml"
          python hack/render-composition.py infra/crossplane/composition.yaml infra/crossplane/example-xr.yaml \
            > "$RUNNER_TEMP/composed.yaml"
          kubeconform -strict -summary \
            -schema-location "$RUNNER_TEMP/schemas/upbound/{{.ResourceKind}}_{{.Group}}_{{.ResourceAPIVersion}}.json" \
            "$RUNNER_TEMP/composed.yaml"

  backstage:
    name: backstage (template schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3 jsonschema==4.26.0 referencing==0.37.0
      - run: |
          python hack/validate-backstage.py backstage/catalog-info.yaml backstage/template/template.yaml \
            backstage/template/skeleton/catalog-info.yaml
