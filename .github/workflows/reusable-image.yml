# Reusable workflow: build and push a container image to GHCR.
#
# Jenkins equivalent: the `Image` stage with `withCredentials([usernamePassword('ghcr-push')])`
# and `docker login / build / push` against a mounted Docker socket. Here the GITHUB_TOKEN with
# `packages: write` replaces the stored credential and Buildx replaces the socket mount.
# Tekton equivalent: the kaniko-build-push task.
name: image (reusable)

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      registry:
        type: string
        default: ghcr.io
      image-name:
        description: Image path under the registry; defaults to <owner>/<service>
        type: string
        default: ""
      tag:
        description: Tag to push; defaults to the 12-char SHA (Jenkins IMAGE_TAG_OVERRIDE otherwise)
        type: string
        default: ""
      context:
        type: string
        default: "."
      push:
        description: Set false on pull requests to build without pushing
        type: boolean
        default: true
    outputs:
      image:
        description: Fully qualified image reference with tag
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Image digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - id: ref
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name || format('{0}/{1}', github.repository_owner, inputs.service) }}
          TAG: ${{ inputs.tag || format('{0}', github.sha) }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [ "$tag" = "$GITHUB_SHA" ] && tag="${GITHUB_SHA:0:12}"
          image="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=$image:$tag"
            echo "name=$image"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ inputs.push }}
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.tag }}
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
