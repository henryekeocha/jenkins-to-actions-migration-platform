name: Go build
description: >-
  Build a Go binary with module verification. Replaces the Jenkins `Build` stage and the
  `agent { docker { image 'golang:...' } }` block: the toolchain comes from actions/setup-go
  instead of a container image, and the artifact is uploaded rather than `archiveArtifacts`-ed.
inputs:
  go-version:
    description: Go version (or go.mod path via go-version-file in the caller)
    required: false
    default: "1.22"
  package:
    description: Package path to build
    required: true
  output:
    description: Path of the binary to produce
    required: true
  working-directory:
    description: Directory containing go.mod
    required: false
    default: "."
outputs:
  binary:
    description: Path to the built binary
    value: ${{ steps.build.outputs.binary }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
    - id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GOFLAGS: -mod=readonly
      run: |
        set -euo pipefail
        go build -o "${{ inputs.output }}" "${{ inputs.package }}"
        echo "binary=${{ inputs.working-directory }}/${{ inputs.output }}" >> "$GITHUB_OUTPUT"
