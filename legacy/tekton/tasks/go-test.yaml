apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-test
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: golang:1.22-bookworm
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        go test -race -coverprofile=cover.out ./...
